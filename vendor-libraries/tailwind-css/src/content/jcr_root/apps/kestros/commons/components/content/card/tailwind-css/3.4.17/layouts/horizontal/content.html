<sly data-sly-use.card="${'io.kestros.cms.components.basic.core.content.card.CardDataSourceComponent'}"/>
<div class="flex overflow-hidden ${card.inlineVariations}">
    <div data-sly-test="${card.imageElement}" class="w-1/3 flex-shrink-0">
        <img class="w-full h-full object-cover" src="${card.imageElement.imagePath}" alt="${card.imageElement.altText}"/>
    </div>
    <div class="p-4">
        <h3 data-sly-test="${card.titleElement}" class="text-lg font-semibold">${card.titleElement.headingText}</h3>
        <p data-sly-test="${card.description}" class="text-sm text-gray-600">${card.description}</p>
    </div>
</div>
