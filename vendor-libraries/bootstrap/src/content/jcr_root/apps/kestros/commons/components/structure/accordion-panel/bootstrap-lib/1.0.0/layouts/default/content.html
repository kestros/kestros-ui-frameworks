<sly data-sly-use.accordionPanel="${'io.kestros.cms.components.basic.core.structure.accordion.AccordionPanelDataSourceComponent'}"/>
<sly data-sly-use.includes="/libs/kestros/commons/components/includes.html"/>
<div class="accordion-item ${accordionPanel.inlineVariations}">
    <h2 class="accordion-header">
        <button class="accordion-button${accordionPanel.expanded ? '' : ' collapsed'}" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapse-${accordionPanel.id}"
                aria-expanded="${accordionPanel.expanded ? 'true' : 'false'}"
                aria-controls="collapse-${accordionPanel.id}">${accordionPanel.title}</button>
    </h2>
    <div id="collapse-${accordionPanel.id}" class="accordion-collapse collapse${accordionPanel.expanded ? ' show' : ''}">
        <div class="accordion-body">
            <sly data-sly-call="${includes.contentArea}"/>
        </div>
    </div>
</div>
