<div class="card story-card h-100 border-0 shadow-sm">
    <a href="${properties.href}"><img src="${properties.imageSrc}" alt="${properties.headline}" class="img-fluid card-img-top"/></a>
    <div class="card-body d-flex flex-column">
        <p class="section-heading mb-2">${properties.category}</p>
        <h5 class="card-title h6 fw-bold mb-2"><a href="${properties.href}" class="text-decoration-none text-dark stretched-link">${properties.headline}</a></h5>
        <p class="card-text small text-muted mb-0">${properties.excerpt}</p>
    </div>
</div>
