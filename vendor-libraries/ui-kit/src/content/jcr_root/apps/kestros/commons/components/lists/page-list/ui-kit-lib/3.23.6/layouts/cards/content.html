<sly data-sly-use.pageList="${'io.kestros.cms.components.basic.lists.PageList'}"
     data-sly-use.context="${'io.kestros.cms.sitebuilding.api.models.ComponentRequestContext'}"/>

<div class="uk-grid-column-small uk-grid-row-large uk-child-width-1-3@s" uk-grid
     data-sly-list.page="${pageList.pages}">
    <div>
        <div class="uk-card uk-card-default">
            <div class="uk-card-header">
                <h3 class="uk-card-title">${page.displayTitle}</h3>
            </div>
            <div data-sly-test="${page.displayDescription}" class="uk-card-body">
                ${page.displayDescription}
            </div>
            <div class="uk-card-footer">
                <a class="uk-button uk-button-text"
                   href="${page.path @ extension='html'}">Read More</a>
            </div>
        </div>
    </div>
</div>
