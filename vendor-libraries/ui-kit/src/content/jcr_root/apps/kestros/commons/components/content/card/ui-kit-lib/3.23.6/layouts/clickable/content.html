<sly data-sly-use.card="${'io.kestros.cms.components.basic.core.content.card.CardDataSourceComponent'}"/>

<a href="${card.primaryButton.href @ context='uri'}"
   target="${card.primaryButton.target}"
   aria-label="${card.primaryButton.ariaLabel}"
   title="${card.primaryButton.title}"
   class="uk-card ${card.inlineVariations} uk-display-block"
   style="text-decoration: none; color: inherit;">
    <div class="uk-card-media-top" data-sly-test="${card.image}">
        <sly data-sly-resource="${card.image}"/>
    </div>
    <div class="uk-card-body">
        <sly data-sly-test="${card.title}" data-sly-resource="${card.title}"/>
        <p data-sly-test="${card.description}">
            ${card.description}
        </p>
    </div>
    <!-- TODO: Verify card.primaryButton is available and has required properties (href, target, ariaLabel, title) -->
</a>
