<sly data-sly-use.link="${'io.kestros.cms.components.basic.core.content.link.LinkDataSourceComponent'}"/>

<a class="${link.inlineVariations}"
   id="${link.id}"
   href="${link.href @ context='uri'}"
   target="${link.targetAsString}"
   aria-label="${link.ariaLabel}"
   aria-disabled="${link.disabled}"
   title="${link.title}">${link.text}</a>
