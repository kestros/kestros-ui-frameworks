<sly data-sly-use.table="${'io.kestros.cms.components.basic.core.content.table.TableDataSourceComponent'}"/>

<div class="uk-overflow-auto">
    <table class="uk-table ${table.inlineVariations}">
        <thead data-sly-test="${table.headers}">
            <tr data-sly-list.header="${table.headers}">
                <sly data-sly-resource="${header}"/>
            </tr>
        </thead>
        <tbody data-sly-list.row="${table.rows}">
            <sly data-sly-resource="${row}"/>
        </tbody>
    </table>
</div>
