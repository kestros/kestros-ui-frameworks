<sly data-sly-use.topNav="${'io.kestros.cms.components.basic.core.navigation.topnav.TopNavigationDataSourceComponent'}"

<nav class="uk-navbar-container ${topNav.inlineVariations}" uk-navbar>
    <div class="uk-navbar-left">
        <sly data-sly-test="${topNav.image}">
            <a class="uk-navbar-item uk-logo" href="#">
                <sly data-sly-resource="${topNav.image}"/>
            </a>
        </sly>
    </div>
    <div class="uk-navbar-center">
        <ul class="uk-navbar-nav" data-sly-test="${topNav.navigationLinks}"
            data-sly-list.navItem="${topNav.navigationLinks}">
            <sly data-sly-resource="${navItem}"/>
        </ul>
    </div>
</nav>
