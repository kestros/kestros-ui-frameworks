<nav class="uk-navbar-container ${context.inlineVariations}">
    <div class="uk-container">
        <div uk-navbar>
            <div class="uk-navbar-left">
                <a href="" class="uk-navbar-item uk-logo">Logo</a>
            </div>
            <div class="uk-navbar-right">

                    </li>
                </ul>
            </div>
        </div>
    </div>
