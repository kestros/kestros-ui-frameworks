<sly data-sly-use.topNav="${'io.kestros.cms.components.basic.core.navigation.topnav.TopNavigationDataSourceComponent'}"/>

<nav class="uk-navbar-container ${topNav.inlineVariations}">
    <div class="uk-container">
        <div uk-navbar>
            <div class="uk-navbar-left">
                <ul class="uk-navbar-nav" data-sly-list.item="${topNav.children}">
                    <sly data-sly-resource="${item}"/>
                </ul>
            </div>
            <div class="uk-navbar-right">
                <a href="" class="uk-navbar-item uk-logo" height="70">
                    <sly data-sly-test="${topNav.logo}" data-sly-resource="${topNav.logo}"/>
                    ${topNav.brandName}
                </a>
            </div>
        </div>
    </div>
</nav>
