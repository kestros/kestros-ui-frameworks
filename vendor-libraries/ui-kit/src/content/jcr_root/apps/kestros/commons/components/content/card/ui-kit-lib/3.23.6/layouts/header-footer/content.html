<sly data-sly-use.card="${'io.kestros.cms.components.basic.core.content.card.CardDataSourceComponent'}"/>


<div class="uk-card ${card.inlineVariations}">
    <div class="uk-card-media-top" data-sly-test="${card.image}">
        <sly data-sly-resource="${card.image}"/>
    </div>
    <div data-sly-test="${card.title}" class="uk-card-header">
        <h3 class="uk-card-title">${card.title}</h3>
    </div>
    <div data-sly-test="${card.description}" class="uk-card-body">
        ${card.description}
    </div>
    <div class="uk-card-footer">

    </div>
</div>
