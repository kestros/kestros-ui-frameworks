<sly data-sly-use.card="${'io.kestros.cms.components.basic.core.content.card.CardDataSourceComponent'}"/>

<a href="${card.buttonGroup.children[0].href @ context='uri'}"
   target="${card.buttonGroup.children[0].target}"
   aria-label="${card.buttonGroup.children[0].ariaLabel}"
   title="${card.buttonGroup.children[0].title}"
   class="uk-card uk-card-primary uk-card-large uk-card-overlay ${card.inlineVariations} uk-display-block"
   style="background-image: url('${card.image.src}'); background-size: cover; background-position: center; text-decoration: none; color: inherit; position: relative;"
   data-sly-test="${card.image && card.buttonGroup}">
    <div class="uk-card-body uk-flex uk-flex-column uk-flex-between" style="min-height: 300px; position: relative; z-index: 1;">
        <div>
            <sly data-sly-test="${card.title}" data-sly-resource="${card.title}"/>
            <p data-sly-test="${card.description}">
                ${card.description}
            </p>
        </div>
    </div>
    <!-- TODO: Verify card.image.src and card.buttonGroup.children[0] are available with required properties (href, target, ariaLabel, title) -->
</a>

<div class="uk-card uk-card-default ${card.inlineVariations}"
     data-sly-test="${!card.image || !card.buttonGroup}">
    <div class="uk-card-body">
        <sly data-sly-test="${card.title}" data-sly-resource="${card.title}"/>
        <p data-sly-test="${card.description}">
            ${card.description}
        </p>
    </div>
    <sly data-sly-test="${card.buttonGroup}" data-sly-resource="${card.buttonGroup}"/>
</div>
