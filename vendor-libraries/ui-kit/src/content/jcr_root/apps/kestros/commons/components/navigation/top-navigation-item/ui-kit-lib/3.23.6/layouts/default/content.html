<sly data-sly-use.topNavItem="${'io.kestros.cms.components.basic.core.navigation.topnav.TopNavigationItemDataSourceComponent'}"/>

<li class="${topNavItem.inlineVariations} ${topNavItem.active ? 'uk-active' : ''}">
    <a href="${topNavItem.href}"
       aria-label="${topNavItem.ariaLabel}"
       aria-current="${topNavItem.active ? 'page' : ''}">${topNavItem.text}</a>
    <div data-sly-test="${topNavItem.navigationItems}" class="uk-navbar-dropdown">
        <ul class="uk-nav uk-navbar-dropdown-nav" data-sly-list.child="${topNavItem.navigationItemLinks}">
            <sly data-sly-resource="${child}"/>
        </ul>
    </div>
    <!-- TODO: Verify topNavItem.active and topNavItem.ariaLabel variables are available from sling model -->
</li>
