<sly data-sly-use.button="${'io.kestros.cms.components.basic.core.content.button.ButtonStaticDataSource'}"/>

<a class="nova-button ${button.inlineVariations}"
   href="${button.href @ context='uri'}"
   target="${button.targetAsString}"
   aria-label="${button.ariaLabel}"
   title="${button.title}">${button.text}</a>
