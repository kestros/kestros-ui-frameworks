<sly data-sly-use.tableRow="${'io.kestros.cms.components.basic.core.content.table.row.TableRowDataSourceComponent'}"/>
<tr class="${tableRow.inlineVariations}">
    <sly data-sly-list.header="${tableRow.headers}">
        <sly data-sly-resource="${header}"/>
    </sly>
    <sly data-sly-list.cell="${tableRow.cells}">
        <sly data-sly-resource="${cell}"/>
    </sly>
</tr>
