<sly data-sly-use.card="${'io.kestros.cms.components.basic.core.content.card.CardDataSourceComponent'}"/>
<div class="ui card ${card.inlineVariations}">
    <div data-sly-test="${card.imageElement}" class="image">
        <img src="${card.imageElement.imagePath}" alt="${card.imageElement.altText}"/>
    </div>
    <div class="content">
        <div data-sly-test="${card.titleElement}" class="header">${card.titleElement.headingText}</div>
        <div data-sly-test="${card.description}" class="description">${card.description}</div>
    </div>
</div>
