<sly data-sly-use.topNav="${'io.kestros.cms.components.basic.core.navigation.topnav.TopNavigationDataSourceComponent'}"/>
<nav class="${topNav.inlineVariations}">
    <ul>
        <li>
            <a href="${properties.brandHref || '#'}">
                <sly data-sly-test="${topNav.image}" data-sly-resource="${topNav.image}"/>
                <strong>${topNav.brandName}</strong>
            </a>
        </li>
    </ul>
    <ul>
        <sly data-sly-list.item="${topNav.navigationLinks}">
            <sly data-sly-resource="${item}"/>
        </sly>
    </ul>
</nav>
