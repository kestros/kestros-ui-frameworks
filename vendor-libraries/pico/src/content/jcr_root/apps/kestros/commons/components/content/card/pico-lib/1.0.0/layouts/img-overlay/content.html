<sly data-sly-use.card="${'io.kestros.cms.components.basic.core.content.card.CardDataSourceComponent'}"/>
<article class="kes-card kes-card-img-overlay ${card.inlineVariations}">
    <img data-sly-test="${card.imageElement}" src="${card.imageElement.imagePath}" class="kes-card-img" alt="${card.imageElement.altText}"/>
    <div class="kes-card-overlay">
        <h3 data-sly-test="${card.titleElement}">${card.titleElement.headingText}</h3>
        <p data-sly-test="${card.description}">${card.description}</p>
        <sly data-sly-test="${card.buttonGroup}" data-sly-resource="${card.buttonGroup}"/>
    </div>
</article>
