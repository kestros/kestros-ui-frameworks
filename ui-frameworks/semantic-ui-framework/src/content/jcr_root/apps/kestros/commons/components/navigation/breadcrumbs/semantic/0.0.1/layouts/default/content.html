<sly data-sly-use.breadcrumbs="${'io.kestros.cms.components.basic.core.navigation.breadcrumbs.BreadCrumbsDataSourceComponent'}"/>
<div class="ui breadcrumb ${breadcrumbs.inlineVariations}">
    <sly data-sly-list.crumb="${breadcrumbs.links}">
        <div class="section">
            <sly data-sly-resource="${crumb}"/>
        </div>
        <div data-sly-test="${!itemList.last}" class="divider">/</div>
    </sly>
</div>
