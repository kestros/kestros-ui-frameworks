<sly data-sly-use.image="${'io.kestros.cms.components.basic.core.content.image.ImageDataSourceComponent'}"/>

<sly data-sly-test="${!image.caption}">
    <sly data-sly-test="${!image.href}">
        <img class="nova-image ${image.inlineVariations}" src="${image.imagePath @ context='uri'}" alt="${image.altText}"
             loading="lazy"/>
    </sly>
    <sly data-sly-test="${image.href}">
        <a href="${image.href @ context='uri'}" target="${image.targetAsString}">
            <img class="nova-image ${image.inlineVariations}" src="${image.imagePath @ context='uri'}" alt="${image.altText}"
                 loading="lazy"/>
        </a>
    </sly>
</sly>

<sly data-sly-test="${image.caption}">
    <figure class="nova-image ${image.inlineVariations}">
        <sly data-sly-test="${!image.href}">
            <img src="${image.imagePath @ context='uri'}" alt="${image.altText}" loading="lazy"/>
        </sly>
        <sly data-sly-test="${image.href}">
            <a href="${image.href @ context='uri'}" target="${image.targetAsString}">
                <img src="${image.imagePath @ context='uri'}" alt="${image.altText}" loading="lazy"/>
            </a>
        </sly>
        <figcaption>${image.caption}</figcaption>
    </figure>
</sly>
