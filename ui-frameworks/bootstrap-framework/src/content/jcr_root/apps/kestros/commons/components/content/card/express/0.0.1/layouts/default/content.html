<sly data-sly-use.card="${'io.kestros.cms.components.basic.core.content.card.CardDataSourceComponent'}"/>
<div class="card ${card.inlineVariations}">
    <img data-sly-test="${card.imageElement}" class="card-img-top" src="${card.imageElement.imagePath}" alt="${card.imageElement.altText}"/>
    <div class="card-body">
        <h5 data-sly-test="${card.titleElement}" class="card-title">${card.titleElement.headingText}</h5>
        <p data-sly-test="${card.description}" class="card-text">${card.description}</p>
    </div>
</div>
