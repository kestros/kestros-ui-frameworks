<sly data-sly-use.topNav="${'io.kestros.cms.components.basic.core.navigation.topnav.TopNavigationDataSourceComponent'}"/>
<nav class="navbar navbar-expand-lg ${topNav.inlineVariations}">
    <a class="navbar-brand" href="#">${topNav.brandName}</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <sly data-sly-list.item="${topNav.navigationLinks}">
                <li class="nav-item">
                    <sly data-sly-resource="${item}"/>
                </li>
            </sly>
        </ul>
    </div>
</nav>
